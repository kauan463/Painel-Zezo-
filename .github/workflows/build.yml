
name: Gerar APK ZEZO SERVERS

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Instalar pacotes Android
        shell: bash
        run: |
          set -e
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Aceitar licenças Android
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto Android
        shell: bash
        run: |
          set -e
          mkdir -p extracted

          ZIP_FILE="ZEZO_SERVERS_FANTA_SENSI_BUILD_NUVEM.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERRO: ZIP do projeto não encontrado."
            ls -la
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_FILE=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Compilar APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean assembleDebug
          else
            gradle --no-daemon clean assembleDebug
          fi

      - name: Localizar APK
        shell: bash
        run: |
          set -e
          mkdir -p apk-final

          APK=$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          cp "$APK" apk-final/ZEZO-SERVERS.apk
          echo "APK encontrado e preparado."

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ZEZO-SERVERS-APK
          path: apk-final/ZEZO-SERVERS.apk
          if-no-files-found: error
